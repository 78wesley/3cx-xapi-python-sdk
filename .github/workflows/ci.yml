name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project with dev extras
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check threecx/ tests/ scripts/

      - name: Type-check
        run: mypy threecx/

      # Also enforced by tests/test_spec_coverage.py; run it standalone so a
      # spec/service mismatch is obvious in the job log rather than buried
      # in a test failure.
      - name: Check swagger.yaml coverage
        run: python scripts/check_spec_coverage.py

      - name: Test
        run: pytest -q
